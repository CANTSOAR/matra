# Render Blueprint for a Matra DEMO instance (fictional data only). See docs/DEPLOY.md.
services:
  - type: web
    name: matra-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # persistent disks need a paid instance type
    region: virginia
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # HMAC key for escrow hashes / fake prelogin salts. Generated once by Render; never change it after
      # accounts exist (it would break escrow matching). Keep it out of git.
      - key: MATRA_PEPPER
        generateValue: true
      # Sealed-matching OPRF key shares A and B: two SEPARATE secrets generated by Render (any >= 32-char secret is
      # accepted and the key is derived from it). Production refuses to start without both and never generates them
      # next to the database. Never change them after entries exist unless you rotate deliberately (MATRA_OPRF_ROTATE=1
      # for one restart). On Render both still live with the same operator — see docs/DEPLOY.md for real separation.
      - key: MATRA_OPRF_KEY_A
        generateValue: true
      - key: MATRA_OPRF_KEY_B
        generateValue: true
      # Matched groups reach counselors only once the matching entries are this old (Sybil mitigation). Default 72.
      - key: MATRA_MATCH_RELEASE_DELAY_HOURS
        value: "72"
      # "DEMO — do not enter real information" banner on every page. Leave on for any demo instance.
      - key: MATRA_DEMO_BANNER
        value: "1"
      # Render terminates TLS in one proxy hop; needed for per-IP rate limiting.
      - key: MATRA_TRUST_PROXY
        value: "1"
      - key: MATRA_DB_PATH
        value: /app/apps/server/data/matra.db
    disk:
      name: matra-data
      mountPath: /app/apps/server/data
      sizeGB: 1
