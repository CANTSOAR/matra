# Render Blueprint for a Matra DEMO instance (fictional data only). See docs/DEPLOY.md.
services:
  - type: web
    name: matra-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # persistent disks need a paid instance type
    region: virginia
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # HMAC key for escrow hashes / fake prelogin salts. Generated once by Render; never change it after
      # accounts exist (it would break escrow matching). Keep it out of git.
      - key: MATRA_PEPPER
        generateValue: true
      # Sealed-matching threshold OPRF (2-of-3) key shares. Render cannot generate consistent Shamir shares, so run the
      # key ceremony yourself (npm run -w @matra/server oprf-ceremony -- --out <dir>) and paste each share's 64-hex
      # value in the dashboard before the first deploy. Production refuses to start without all three and never
      # generates them next to the database. Never change them after entries exist unless you rotate deliberately
      # (MATRA_OPRF_ROTATE=1 for one restart). Here all three live with the same operator (in-process): demo only —
      # see docs/DEPLOY.md for running the holders separately.
      - key: MATRA_OPRF_SHARE_1
        sync: false
      - key: MATRA_OPRF_SHARE_2
        sync: false
      - key: MATRA_OPRF_SHARE_3
        sync: false
      # Matched groups reach counselors only once the matching entries are this old (Sybil mitigation). Default 72.
      - key: MATRA_MATCH_RELEASE_DELAY_HOURS
        value: "72"
      # "DEMO — do not enter real information" banner on every page. Leave on for any demo instance.
      - key: MATRA_DEMO_BANNER
        value: "1"
      # Fictional-data demo: lets the mock SMS provider run in production (it sends nothing and shows the code on
      # screen; it verifies nothing about the phone) and forces the DEMO banner. A real deployment sets
      # MATRA_SMS_PROVIDER=twilio + TWILIO_* instead and removes both of these.
      - key: MATRA_DEMO_MODE
        value: "1"
      - key: MATRA_SMS_PROVIDER
        value: mock
      # HMAC key for phone tokens (phone verify-then-forget, W19). Kept outside the database; generated once by Render.
      # Changing it later only means a phone already used can enable accounts again.
      - key: MATRA_PHONE_HASH_KEY
        generateValue: true
      # The matcher runs inside this server with a SIMULATED attestation (demo only; refused in production without
      # MATRA_DEMO_MODE=1). Its key and the simulated platform key, generated once by Render. Not hardware attestation.
      - key: MATRA_MATCHER_KEY
        generateValue: true
      - key: MATRA_ATTESTATION_PLATFORM_KEY
        generateValue: true
      # Render terminates TLS in one proxy hop; needed for per-IP rate limiting.
      - key: MATRA_TRUST_PROXY
        value: "1"
      - key: MATRA_DB_PATH
        value: /app/apps/server/data/matra.db
    disk:
      name: matra-data
      mountPath: /app/apps/server/data
      sizeGB: 1
